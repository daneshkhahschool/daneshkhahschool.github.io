<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://school.daneshkhah.workers.dev">
  <title>Redirecting…</title>
  <script>
    window.location.replace("https://school.daneshkhah.workers.dev");
  </script>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .loader {
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
    .loader::after {
      content: "";
      display: block;
      width: 40px;
      height: 40px;
      margin: 1rem auto 0;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">Redirecting…</div>
</body>
</html>

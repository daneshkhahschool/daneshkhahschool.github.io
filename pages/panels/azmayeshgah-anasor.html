:root{

.panel{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}

.elinfo h4{margin:0;font-size:22px}

.res.bad{background:rgba(255,107,129,.12);border-color:rgba(255,107,129,.5)}
.res .formula{font-size:38px;font-weight:800;text-align:center;line-height:1.3}
.res .rn{text-align:center;font-size:18px;font-weight:600}
.res p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.badge{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:rgba(255,255,255,.14);margin:2px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bk{border-radius:14px;padding:8px 4px;text-align:center;border:1px dashed var(--line);color:var(--mute);font:inherit;background:transparent;min-height:68px}
.bk.f{border-style:solid;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.07)}
.bk.f:hover{border-color:var(--teal)}
.bk .bf{font-size:18px;font-weight:800;direction:ltr}
.bk .bn{font-size:11px}

.vhead{margin:4px 0 14px}.vhead h2{margin:0;font-size:24px;font-weight:800}.vhead p{margin:4px 0 0;color:var(--mute);font-size:14px}
button,.tab,.chip,.opt,.el,.gc{touch-action:manipulation}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
'use strict';

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>FA[d]);
const num=n=>fa(Number(n).toLocaleString('en-US')).replace(/,/g,'٬');
const dec=n=>fa(String(n)).replace('.','٫');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sub=f=>f.replace(/(\d+)/g,'<sub>$1</sub>');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const DPR=Math.min(window.devicePixelRatio||1,2);
const store={
  get(k,d){try{const v=localStorage.getItem('adn_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('adn_'+k,JSON.stringify(v))}catch(e){}}
};
const S={xp:store.get('xp',0),found:store.get('found',[]),seen:store.get('seen',[])};
let current='hub';

let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800)}
const TITLES=['نوآموز کنجکاو','کاوشگر','آزمایشگر','پژوهنده','دانشمند جوان','نابغهٔ علوم'];
function renderXP(){
  const lv=Math.floor(S.xp/100)+1;
  $('#lvl').textContent=fa(lv);
  $('#ttl').textContent=TITLES[Math.min(lv-1,TITLES.length-1)];
  $('#xpfill').style.width=(S.xp%100)+'%';
  $('#xpn').textContent=fa(S.xp)+' امتیاز';
}
function addXP(n){
  if(!n)return;
  const before=Math.floor(S.xp/100);
  S.xp=Math.max(0,S.xp+n);store.set('xp',S.xp);renderXP();
  if(Math.floor(S.xp/100)>before&&n>0){confetti();toast('🎉 سطح جدید: '+TITLES[Math.min(Math.floor(S.xp/100),TITLES.length-1)])}
  else toast((n>0?'+':'−')+fa(Math.abs(n))+' امتیاز');
}
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxOn=false;
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}
addEventListener('resize',sizeFx);sizeFx();
function confetti(x=innerWidth/2,y=innerHeight/3,n=90){
  if(RM)return;
  const cols=['#2de2c8','#ffb53d','#ff6b81','#9b8cff','#bfe35a','#4cc9f0'];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*11,vy:Math.random()*-10-2,g:.3,r:3+Math.random()*4,c:rnd(cols),life:80+Math.random()*40,rot:Math.random()*6,vr:(Math.random()-.5)*.4});
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}
}
function fxLoop(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life--;p.rot+=p.vr;
    fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.globalAlpha=Math.min(1,p.life/30);fctx.fillStyle=p.c;fctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);fctx.restore()}
  if(parts.length)requestAnimationFrame(fxLoop);else fxOn=false;
}

(function(){
  const c=$('#bg'),x=c.getContext('2d');let W,H,st=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;st=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,p:Math.random()*6,s:Math.random()*.15+.03}))}
  function draw(t){
    x.clearRect(0,0,W,H);
    for(const s of st){
      const a=.35+.65*Math.abs(Math.sin(s.p+t/1200*s.s*8));
      x.globalAlpha=a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill();
      if(!RM){s.y+=s.s*.3;if(s.y>H)s.y=0}
    }
    if(!RM)requestAnimationFrame(draw);
  }
  addEventListener('resize',size);size();requestAnimationFrame(draw);
})();

current='chem';

const CAT={
  nm:['نافلز','#2de2c8'],ng:['گاز نجیب','#a78bfa'],al:['فلز قلیایی','#ff6b81'],ae:['قلیایی خاکی','#ffb53d'],
  md:['شبه‌فلز','#bfe35a'],pt:['فلز اصلی','#7fd0e8'],tm:['فلز واسطه','#6f9bff'],hl:['هالوژن','#ff8fd6']
};
const EL=[
 ['H',1,'هیدروژن',1.008,'nm',[1],'گاز','سبک‌ترین و فراوان‌ترین عنصر جهان؛ سوخت ستاره‌هاست.'],
 ['He',2,'هلیوم',4.003,'ng',[2],'گاز','سبک‌تر از هوا و واکنش‌ناپذیر؛ در بالن‌ها و دستگاه MRI.'],
 ['Li',3,'لیتیم',6.94,'al',[2,1],'جامد','سبک‌ترین فلز؛ در باتری گوشی‌ها و لپ‌تاپ‌ها.'],
 ['Be',4,'بریلیم',9.012,'ae',[2,2],'جامد','فلزی سبک و بسیار سخت؛ در آلیاژهای هوافضا.'],
 ['B',5,'بور',10.81,'md',[2,3],'جامد','شبه‌فلزی که به شیشه‌های مقاوم در برابر گرما (پیرکس) می‌رود.'],
 ['C',6,'کربن',12.011,'nm',[2,4],'جامد','پایهٔ حیات؛ الماس و گرافیت هر دو کربن خالص‌اند.'],
 ['N',7,'نیتروژن',14.007,'nm',[2,5],'گاز','حدود ۷۸٪ هوای اطراف ما؛ در کودهای شیمیایی.'],
 ['O',8,'اکسیژن',15.999,'nm',[2,6],'گاز','حدود ۲۱٪ هوا؛ برای تنفس و سوختن لازم است.'],
 ['F',9,'فلوئور',18.998,'hl',[2,7],'گاز','واکنش‌پذیرترین نافلز؛ در خمیردندان به شکل فلوراید.'],
 ['Ne',10,'نئون',20.18,'ng',[2,8],'گاز','نور نارنجی‌سرخ تابلوهای نئون را می‌سازد.'],
 ['Na',11,'سدیم',22.99,'al',[2,8,1],'جامد','فلزی نرم که با آب شدید واکنش می‌دهد؛ در نمک خوراکی.'],
 ['Mg',12,'منیزیم',24.305,'ae',[2,8,2],'جامد','در رنگدانهٔ سبز گیاهان است؛ با نور سفید خیره‌کننده می‌سوزد.'],
 ['Al',13,'آلومینیم',26.982,'pt',[2,8,3],'جامد','سبک و ضدزنگ؛ در قوطی نوشابه و بدنهٔ هواپیما.'],
 ['Si',14,'سیلیسیم',28.085,'md',[2,8,4],'جامد','ماده اصلی تراشه‌های الکترونیکی و شیشه.'],
 ['P',15,'فسفر',30.974,'nm',[2,8,5],'جامد','در DNA و استخوان‌ها؛ در سر کبریت.'],
 ['S',16,'گوگرد',32.06,'nm',[2,8,6],'جامد','جامد زرد رنگ؛ در آتشفشان‌ها و ساخت لاستیک.'],
 ['Cl',17,'کلر',35.45,'hl',[2,8,7],'گاز','گاز زرد‌سبز و سمی؛ برای ضدعفونی آب استخرها.'],
 ['Ar',18,'آرگون',39.948,'ng',[2,8,8],'گاز','سومین گاز فراوان هوا؛ داخل برخی لامپ‌ها.'],
 ['K',19,'پتاسیم',39.098,'al',[2,8,8,1],'جامد','در موز و ماهیچه‌هاست؛ مانند سدیم بسیار واکنش‌پذیر.'],
 ['Ca',20,'کلسیم',40.078,'ae',[2,8,8,2],'جامد','سازندهٔ استخوان و دندان؛ در شیر فراوان است.'],
 ['Fe',26,'آهن',55.845,'tm',[2,8,14,2],'جامد','هستهٔ زمین بیشتر آهن است؛ فولاد و هموگلوبین خون.'],
 ['Cu',29,'مس',63.546,'tm',[2,8,18,1],'جامد','رسانای عالی برق؛ معدن سرچشمهٔ کرمان از بزرگ‌ترین معادن مس جهان است.'],
 ['Zn',30,'روی',65.38,'tm',[2,8,18,2],'جامد','برای روکش گالوانیزه و جلوگیری از زنگ‌زدن آهن.'],
 ['Ag',47,'نقره',107.87,'tm',[2,8,18,18,1],'جامد','بهترین رسانای برق و گرما در میان فلزها.'],
 ['Au',79,'طلا',196.97,'tm',[2,8,18,32,18,1],'جامد','بسیار کم‌واکنش؛ زنگ نمی‌زند و سال‌ها می‌درخشد.']
].map(a=>({s:a[0],z:a[1],n:a[2],m:a[3],c:a[4],sh:a[5],st:a[6],f:a[7]}));
const EBY=Object.fromEntries(EL.map(e=>[e.s,e]));

const BOND={ion:'پیوند یونی',cov:'پیوند کووالانسی',elem:'مولکول عنصری'};
const RECIPES=[
 ['H2O','آب',{H:2,O:1},'cov','#4cc9f0','حل‌کنندهٔ جهانی؛ حدود ۷۰٪ بدن انسان آب است.'],
 ['CO2','کربن دی‌اکسید',{C:1,O:2},'cov','#b8c4d6','گاز بازدم و گازدار کردن نوشابه؛ یک گاز گلخانه‌ای مهم.'],
 ['NaCl','سدیم کلرید (نمک خوراکی)',{Na:1,Cl:1},'ion','#f4f7ff','فلزی واکنش‌پذیر و گازی سمی با هم نمکی ضروری برای بدن می‌سازند.'],
 ['CH4','متان',{C:1,H:4},'cov','#ffd166','جزء اصلی گاز طبیعی و سوخت خانه‌ها.'],
 ['NH3','آمونیاک',{N:1,H:3},'cov','#9bf6ff','برای ساخت کود شیمیایی و شوینده‌ها؛ بوی تند دارد.'],
 ['HCl','هیدروکلریک اسید',{H:1,Cl:1},'cov','#ffee93','جوهر نمک؛ اسید معده هم حاوی آن است.'],
 ['MgO','منیزیم اکسید',{Mg:1,O:1},'ion','#e9ecef','حاصل سوختن نوار منیزیم؛ در آجرهای نسوز.'],
 ['CaO','کلسیم اکسید (آهک زنده)',{Ca:1,O:1},'ion','#f1e9da','در ساختمان‌سازی و ساخت سیمان.'],
 ['Al2O3','آلومینیم اکسید',{Al:2,O:3},'ion','#f6c1d1','لایهٔ محافظ روی آلومینیم؛ یاقوت سرخ و کبود از بلورهای آن‌اند.'],
 ['Fe2O3','آهن(III) اکسید (زنگ آهن)',{Fe:2,O:3},'ion','#c1440e','همان زنگ قرمز‌قهوه‌ای که روی آهن‌های مرطوب می‌نشیند.'],
 ['SO2','گوگرد دی‌اکسید',{S:1,O:2},'cov','#e8d44d','از آتشفشان‌ها و سوختن سوخت‌های فسیلی؛ عامل باران اسیدی.'],
 ['H2S','هیدروژن سولفید',{H:2,S:1},'cov','#d4e157','بوی تخم‌مرغ گندیده می‌دهد و سمی است.'],
 ['O2','اکسیژن',{O:2},'elem','#8ecae6','گاز تنفس جانداران؛ در هوا به شکل مولکول دو‌اتمی است.'],
 ['N2','نیتروژن',{N:2},'elem','#a9def9','بیشتر هوا را می‌سازد و بسیار پایدار است.'],
 ['H2','هیدروژن',{H:2},'elem','#ffadad','سبک‌ترین گاز و سوخت پاک آینده.'],
 ['Cl2','کلر',{Cl:2},'elem','#c3e88d','گاز زرد‌سبز برای ضدعفونی آب.'],
 ['CaCl2','کلسیم کلرید',{Ca:1,Cl:2},'ion','#e6ecff','برای آب‌کردن یخ جاده‌ها و خشک‌کردن هوا.'],
 ['KCl','پتاسیم کلرید',{K:1,Cl:1},'ion','#f0f4ff','کود کشاورزی و جایگزین نمک در برخی غذاها.'],
 ['CO','کربن مونوکسید',{C:1,O:1},'cov','#9aa5b1','گاز سمی بی‌رنگ و بی‌بو از سوختن ناقص؛ خطر بخاری‌های بدون دودکش!'],
 ['H2O2','هیدروژن پراکسید (آب‌اکسیژنه)',{H:2,O:2},'cov','#b5e8ff','ضدعفونی‌کنندهٔ زخم؛ با یک اتم اکسیژن بیشتر از آب.'],
 ['SiO2','سیلیسیم دی‌اکسید',{Si:1,O:2},'cov','#f5deb3','ماسه و کوارتز؛ مادهٔ اصلی ساخت شیشه.'],
 ['MgCl2','منیزیم کلرید',{Mg:1,Cl:2},'ion','#dfe7ff','در آب دریا و دریاچه‌ها وجود دارد.'],
 ['Na2O','سدیم اکسید',{Na:2,O:1},'ion','#f3e5ab','در تولید شیشه به کار می‌رود.'],
 ['CuO','مس(II) اکسید',{Cu:1,O:1},'ion','#2b2b2b','پودر سیاه‌رنگ؛ در رنگ‌دادن به شیشه و سرامیک.'],
 ['Ag2S','نقره سولفید',{Ag:2,S:1},'ion','#555b66','لایهٔ سیاهی که روی نقره‌آلات می‌نشیند و آن‌ها را تیره می‌کند.'],
 ['ZnO','روی اکسید',{Zn:1,O:1},'ion','#f8f9fa','در کرم‌های ضدآفتاب و پمادها.'],
 ['NaOH','سدیم هیدروکسید (سود)',{Na:1,O:1,H:1},'ion','#d8f3dc','باز قوی و سوزاننده؛ در صابون‌سازی.'],
 ['HNO3','نیتریک اسید',{H:1,N:1,O:3},'cov','#ffe066','در ساخت کود و مواد منفجره.'],
 ['CaCO3','کلسیم کربنات',{Ca:1,C:1,O:3},'ion','#fdfcf5','سنگ‌آهک، مرمر و پوستهٔ تخم‌مرغ و صدف.'],
 ['NaHCO3','سدیم بی‌کربنات (جوش‌شیرین)',{Na:1,H:1,C:1,O:3},'ion','#fffaf0','در شیرینی‌پزی؛ با اسید گاز CO₂ آزاد می‌کند.'],
 ['H2SO4','سولفوریک اسید',{H:2,S:1,O:4},'cov','#ffd60a','مهم‌ترین مادهٔ شیمیایی صنعتی؛ در باتری خودرو.'],
 ['C6H12O6','گلوکز',{C:6,H:12,O:6},'cov','#ffcad4','قند خون و منبع انرژی سلول‌ها. (چالش سخت!)']
].map(a=>({f:a[0],n:a[1],c:a[2],t:a[3],col:a[4],u:a[5]}));
function keyOf(c){return Object.keys(c).filter(x=>c[x]>0).sort().map(x=>x+c[x]).join('|')}
RECIPES.forEach(r=>{r.key=keyOf(r.c);r.atoms=Object.values(r.c).reduce((a,b)=>a+b,0);r.mass=Object.entries(r.c).reduce((a,[s,n])=>a+EBY[s].m*n,0)});

let flask={},postCol=null,lastEl='H',mission=null,hintLv=0,chemReady=false;
const total=()=>Object.values(flask).reduce((a,b)=>a+b,0);

function bohr(e){
  const col=CAT[e.c][1];let g='';
  e.sh.forEach((n,i)=>{
    const r=17+i*13,dur=3+i*1.7;let d='';
    for(let k=0;k<n;k++){const a=k/n*Math.PI*2;d+=`<circle cx="${(100+r*Math.cos(a)).toFixed(1)}" cy="${(100+r*Math.sin(a)).toFixed(1)}" r="2.7" fill="${col}"/>`}
    g+=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="rgba(255,255,255,.16)"/><g class="ring" style="animation-duration:${dur}s;animation-direction:${i%2?'reverse':'normal'}">${d}</g>`;
  });
  return `<svg viewBox="0 0 200 200" class="bohr" aria-label="مدل بور ${e.n}">${g}<circle cx="100" cy="100" r="9" fill="#ffb53d"/></svg>`;
}
function showEl(sym){
  lastEl=sym;const e=EBY[sym],c=CAT[e.c];
  $('#elinfo').innerHTML=`${bohr(e)}<div>
    <h4><span class="ltr" style="color:${c[1]}">${e.s}</span> · ${e.n}</h4>
    <div class="kv"><span>عدد اتمی</span><b>${fa(e.z)}</b><span>جرم اتمی</span><b>${dec(e.m)}</b>
    <span>دستهٔ عنصر</span><b>${c[0]}</b><span>حالت (اتاق)</span><b>${e.st}</b>
    <span>لایه‌های الکترونی</span><b>${e.sh.map(fa).join('، ')}</b><span>الکترون لایهٔ آخر</span><b>${fa(e.sh[e.sh.length-1])}</b></div>
    <div style="font-size:14px">${e.f}</div></div>`;
}
function chemInit(){
  if(!chemReady){
    chemReady=true;
    $('#tiles').innerHTML=EL.map(e=>`<button class="el" data-s="${e.s}" style="--c:${CAT[e.c][1]}" aria-label="${e.n}"><small>${fa(e.z)}</small><b>${e.s}</b><span>${e.n}</span></button>`).join('');
    $$('.el').forEach(b=>b.onclick=()=>{addEl(b.dataset.s);b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit')});
    $('#legend').innerHTML=Object.values(CAT).map(c=>`<span><i class="dot" style="background:${c[1]}"></i> ${c[0]}</span>`).join('');
    $('#mixBtn').onclick=mix;
    $('#clrBtn').onclick=()=>{flask={};postCol=null;$('#result').innerHTML='';updateFlask()};
    $('#hintBtn').onclick=hint;
    showEl('H');newMission();
  }
  renderBook();updateFlask();
}
function addEl(s){
  if(total()>=30){toast('فلاسک پر شد!');return}
  flask[s]=(flask[s]||0)+1;postCol=null;showEl(s);updateFlask();
}
function subEl(s){flask[s]--;if(flask[s]<=0)delete flask[s];updateFlask()}
function mixColor(){
  const k=Object.keys(flask);if(!k.length)return null;
  let r=0,g=0,b=0,t=0;
  k.forEach(s=>{const h=CAT[EBY[s].c][1];const n=flask[s];r+=parseInt(h.slice(1,3),16)*n;g+=parseInt(h.slice(3,5),16)*n;b+=parseInt(h.slice(5,7),16)*n;t+=n});
  return `rgb(${Math.round(r/t)},${Math.round(g/t)},${Math.round(b/t)})`;
}
function updateFlask(){
  const t=total(),fl=$('#flask');
  $('#chips').innerHTML=Object.keys(flask).map(s=>`<span class="fchip"><span class="ltr" style="color:${CAT[EBY[s].c][1]}">${s}</span> × ${fa(flask[s])}<button data-s="${s}" aria-label="کم کردن ${EBY[s].n}">−</button></span>`).join('')||'<span style="color:var(--mute);font-size:13px">فلاسک خالی است</span>';
  $$('#chips button').forEach(b=>b.onclick=()=>subEl(b.dataset.s));
  const col=postCol||mixColor()||'#4cc9f0';
  fl.style.setProperty('--liq',col);
  let level=t>0?Math.min(1,.25+t/14):(postCol?.5:0);
  $('#liquid').style.transform=`translateY(${level?238-level*128:240}px)`;
  fl.classList.toggle('has',level>0);
}
function pickMission(){
  const left=RECIPES.filter(r=>!S.found.includes(r.f)&&r.f!=='C6H12O6'&&(!mission||r.f!==mission.f));
  const pool=left.length?left:RECIPES.filter(r=>!mission||r.f!==mission.f);
  return rnd(pool);
}
function newMission(){
  mission=pickMission();hintLv=0;renderMission();
}
function renderMission(){
  $('#mission').innerHTML=`<div><div class="mt">ماموریت</div><div class="mn">بساز: ${mission.n}</div><div class="mh" id="mh">${hintLv?hintText():'چه عنصرهایی و از هر کدام چند اتم لازم است؟'}</div></div>
    <button class="btn" id="skipM">ماموریت دیگر</button>`;
  $('#skipM').onclick=newMission;
}
function hintText(){
  const els=Object.keys(mission.c);
  if(hintLv===1)return `💡 این ترکیب از ${fa(els.length)} نوع عنصر و در مجموع ${fa(mission.atoms)} اتم ساخته شده است.`;
  if(hintLv===2)return `💡 عنصرها: ${els.map(s=>EBY[s].n+' ('+s+')').join('، ')}`;
  return `💡 فرمول: <span class="ltr"><b>${sub(mission.f)}</b></span>`;
}
function hint(){
  if(hintLv>=3)return;hintLv++;
  if(S.xp>=2)addXP(-2);
  renderMission();
}
function mix(){
  const t=total(),res=$('#result'),fl=$('#flask');
  if(!t){res.innerHTML='<div class="res bad">فلاسک خالی است. چند عنصر اضافه کن.</div>';return}
  const k=keyOf(flask),r=RECIPES.find(x=>x.key===k);
  fl.classList.remove('shake');
  if(r){
    postCol=r.col;flask={};updateFlask();
    fl.classList.add('boil','glow');setTimeout(()=>fl.classList.remove('boil','glow'),1600);
    showResult(r,true);
    const rect=fl.getBoundingClientRect();confetti(rect.left+rect.width/2,rect.top+rect.height*.5,60);
  }else{
    void fl.offsetWidth;fl.classList.add('shake');
    let msg='با این عنصرها و این نسبت، ترکیب پایداری ساخته نشد. تعداد اتم‌ها را تغییر بده یا عنصرهای دیگری امتحان کن.';
    const syms=Object.keys(flask);
    if(syms.some(s=>EBY[s].c==='ng'))msg='گازهای نجیب لایهٔ آخر پر دارند و تقریباً با هیچ عنصری ترکیب نمی‌شوند.';
    else if(RECIPES.some(r=>keyOf(r.c)!==k&&syms.every(s=>(r.c[s]||0)>=flask[s])))msg='نزدیکی! به‌نظر می‌رسد چیزی از ترکیب مورد نظر کم است.';
    else if(RECIPES.some(r=>Object.keys(r.c).every(s=>(flask[s]||0)>=r.c[s])))msg='تقریباً! به‌نظر می‌رسد چند اتم اضافی در فلاسک داری.';
    res.innerHTML=`<div class="res bad"><b>واکنش ناموفق</b><p>${msg}</p></div>`;
  }
}
function showResult(r,fresh){
  let extra='';
  if(fresh){
    if(!S.found.includes(r.f)){S.found.push(r.f);store.set('found',S.found);addXP(15);extra='<span class="badge">🆕 کشف جدید (+۱۵)</span>'}
    if(mission&&r.key===mission.key){setTimeout(()=>{addXP(25);toast('✅ ماموریت انجام شد!')},900);setTimeout(newMission,2200);extra+='<span class="badge">🎯 ماموریت انجام شد (+۲۵)</span>'}
  }
  $('#result').innerHTML=`<div class="res ok"><div class="formula"><span class="ltr">${sub(r.f)}</span></div>
    <div class="rn">${r.n}</div>
    <div style="text-align:center"><span class="badge">${BOND[r.t]}</span><span class="badge">${fa(r.atoms)} اتم</span><span class="badge">جرم مولکولی ≈ ${dec(r.mass.toFixed(1))}</span>${extra}</div>
    <p>${r.u}</p>
    <p style="font-size:12px">${r.t==='ion'?'در پیوند یونی، فلز الکترون می‌دهد و نافلز الکترون می‌گیرد.':r.t==='cov'?'در پیوند کووالانسی، اتم‌ها الکترون‌هایشان را به اشتراک می‌گذارند.':'اتم‌های هم‌نوع با اشتراک الکترون به هم می‌پیوندند.'}</p></div>`;
  renderBook();
}
function renderBook(){
  $('#bookn').textContent=fa(S.found.length)+' از '+fa(RECIPES.length);
  $('#book').innerHTML=RECIPES.map(r=>S.found.includes(r.f)
    ?`<button class="bk f" data-f="${r.f}"><div class="bf">${sub(r.f)}</div><div class="bn">${r.n.split(' (')[0]}</div></button>`
    :`<div class="bk"><div class="bf">؟</div><div class="bn">${fa(r.atoms)} اتم</div></div>`).join('');
  $$('.bk.f').forEach(b=>b.onclick=()=>{showResult(RECIPES.find(r=>r.f===b.dataset.f),false);$('#result').scrollIntoView({behavior:'smooth',block:'center'})});
}

renderXP();
chemInit();
</script>
</body>
</html>
